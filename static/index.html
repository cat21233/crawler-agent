<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crawler-agent · 控制台</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #171d24;
    --border: #2a333d;
    --text: #d7dde3;
    --muted: #7b8794;
    --dim: #4a5560;
    --accent: #4a9eff;
    --ok: #3fb950;
    --err: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.6;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }

  /* A 输入区 */
  .bar { display: flex; gap: 8px; }
  #q {
    flex: 1; padding: 10px 12px;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    font-family: inherit; font-size: 14px;
  }
  #q:focus { outline: none; border-color: var(--accent); }
  #go {
    padding: 10px 22px; border: none; border-radius: 6px;
    background: var(--accent); color: #fff;
    font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #go:hover:not(:disabled) { background: #3a8ee8; }
  #go:disabled { background: #2f3945; color: var(--muted); cursor: not-allowed; }

  /* B 状态行 */
  #status {
    margin: 14px 0 4px; padding: 8px 12px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; color: var(--muted);
  }
  #status.running { color: var(--accent); }

  /* C 事件流 */
  .label { font-size: 12px; color: var(--muted); margin: 16px 0 6px; }
  #events {
    max-height: 300px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 12.5px; line-height: 1.75;
  }
  .ev .t { color: var(--muted); }
  .ev .n { color: var(--text); }
  .ev.ok .n { color: var(--ok); }
  .ev.err .n { color: var(--err); }
  .placeholder { color: var(--dim); }

  /* D 答案区（渲染后的 markdown） */
  #answer {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 12px 14px;
    min-height: 64px; font-size: 14px;
    word-break: break-word;
  }
  #answer h3, #answer h4 {
    font-size: 14px; font-weight: 600; color: var(--accent);
    margin: 14px 0 6px;
  }
  #answer h3:first-child, #answer h4:first-child { margin-top: 0; }
  #answer ul { margin: 4px 0; padding-left: 22px; }
  #answer li { margin: 2px 0; }
  #answer strong { color: #fff; font-weight: 600; }
  #answer code {
    background: #0b0f14; border: 1px solid var(--border);
    border-radius: 3px; padding: 1px 5px;
    font-family: "Cascadia Code", Consolas, monospace; font-size: 12.5px;
    color: #e6b673;
  }
  #answer pre.code {
    background: #0b0f14; border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px; overflow-x: auto;
    font-family: "Cascadia Code", Consolas, monospace; font-size: 12.5px;
    color: var(--text); white-space: pre;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>crawler-agent</h1>
  <div class="sub">SSE 事件流 · 每一步都可见</div>

  <!-- A 输入 -->
  <div class="bar">
    <input id="q" placeholder="例如：抓取 target 1 的商品并保存到数据库" autocomplete="off">
    <button id="go">开跑</button>
  </div>

  <!-- B 状态行 -->
  <div id="status">● 空闲</div>

  <!-- C 事件流 -->
  <div class="label">事件流</div>
  <div id="events"><div class="placeholder">（等待开跑）</div></div>

  <!-- D 最终答案 -->
  <div class="label">最终答案</div>
  <div id="answer"></div>
</div>

<script src="/static/app.js" defer></script>
</body>
</html>
